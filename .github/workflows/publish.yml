# Publishes @cherrydotfun/miniapp-sdk to npm when main carries a version npm
# does not have yet. Releasing is: bump "version" in package.json, add the
# CHANGELOG entry, merge to main. A push that does not change the version
# runs the checks and publishes nothing.
#
# Two jobs, so nothing that runs third-party code holds a credential: `check`
# installs, tests and builds read-only; `publish` installs with
# --ignore-scripts, never keeps the checkout's token, and is the only job with
# id-token (provenance) and NPM_TOKEN. It runs for main only.
#
# Needs the NPM_TOKEN repository secret (an npm automation token with publish
# rights on @cherrydotfun). Without it the job says so and stops — it never
# fails a merge for a missing secret.
name: Publish SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck, test, build
        run: npm run typecheck && npm test && npm run build

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Is this version on npm yet?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new; publishing."
          fi

      - name: Install (no install scripts) and build
        if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts && npm run build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; v$VERSION was built but not published."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
          git tag "v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "v$VERSION"
