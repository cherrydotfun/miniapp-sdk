# Publishes @cherrydotfun/miniapp-sdk to npm when main carries a version npm
# does not have yet. Releasing is: bump "version" in package.json, add the
# CHANGELOG entry, merge to main. A push that does not change the version
# runs the checks and publishes nothing.
#
# `check` installs, tests and builds read-only; `publish` installs with
# --ignore-scripts, never keeps the checkout's token, and is the only job with
# id-token (npm trusted publishing and provenance). It runs for main only.
#
# npm must trust cherrydotfun/miniapp-sdk, workflow publish.yml.
# No npm access token or repository secret is required.
name: Publish SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Typecheck, test, build
        run: npm run typecheck && npm test && npm run build

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      # OIDC requires npm >= 11.5.1. Do not configure token auth via setup-node.
      - name: Set up npm for trusted publishing
        run: npm install --global npm@11

      - name: Is this version on npm yet?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new; publishing."
          fi

      - name: Install (no install scripts) and build
        if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts && npm run build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public --ignore-scripts

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git tag "v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "v$VERSION"
